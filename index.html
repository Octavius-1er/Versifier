<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Poète Virtuel - Jeu de Versification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Le Poète Virtuel</h1>
        <p>Transformez la phrase en prose ci-dessous en un court poème ou quelques vers. Laissez libre cours à votre imagination !</p>

        <div class="card">
            <h2>Phrase à versifier :</h2>
            <div id="proseText" class="text-display">
                <!-- La phrase en prose sera insérée ici par JavaScript -->
            </div>
            <button id="newPhraseBtn" class="button primary">Nouvelle phrase</button>
        </div>

        <div class="card input-card">
            <h2>Votre œuvre poétique :</h2>
            <textarea id="poetryInput" placeholder="Écrivez vos vers ici... (ex: Mon cœur léger comme une plume, s'envole vers l'azur.)" rows="6"></textarea>
            <button id="submitPoemBtn" class="button secondary">Soumettre mon poème</button>
        </div>

        <div id="resultCard" class="card result-card hidden">
            <h2>Votre création :</h2>
            <div id="yourProse" class="text-display"></div>
            <div id="yourPoem" class="text-display poem-output"></div>
            <button id="resetGameBtn" class="button primary">Rejouer</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
